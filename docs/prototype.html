<script>
"use strict";

/* =====================================================================
   lib/money.ts
   ===================================================================== */

function toCents(value) {
  if (typeof value === "number") {
    if (!Number.isFinite(value)) throw new Error("non-finite");
    return Math.sign(value) * Math.round(Math.abs(value) * 100);
  }
  const trimmed = String(value).trim();
  const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(trimmed);
  if (!match) throw new Error("unparseable money string");
  const sign = match[1], whole = match[2], fraction = match[3] || "";
  const cents = Number(whole) * 100 + Number((fraction + "00").slice(0, 2));
  const third = fraction.length > 2 ? Number(fraction[2]) : 0;
  const rounded = cents + (third >= 5 ? 1 : 0);
  return sign === "-" ? -rounded : rounded;
}

const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const formatCents = (c) => fmt.format(c / 100);
const formatAbs = (c) => fmt.format(Math.abs(c) / 100);

/** Largest-remainder apportionment — exact by construction. */
function apportion(total, weights, keys) {
  if (weights.length !== keys.length) throw new Error("length mismatch");
  if (weights.length === 0) return [];
  if (weights.some((w) => !Number.isFinite(w) || w < 0)) throw new Error("bad weight");

  const totalWeight = weights.reduce((a, b) => a + b, 0);
  if (totalWeight <= 0) throw new Error("total weight must be greater than zero");

  const sign = total < 0 ? -1 : 1;
  const magnitude = Math.abs(total);
  const exact = weights.map((w) => (magnitude * w) / totalWeight);
  const floors = exact.map(Math.floor);
  let remaining = magnitude - floors.reduce((a, b) => a + b, 0);

  const order = exact
    .map((value, i) => ({ i: i, frac: value - Math.floor(value), key: keys[i] }))
    .sort((a, b) => b.frac - a.frac || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));

  const parts = floors.slice();
  for (let n = 0; n < order.length && remaining > 0; n++) {
    if (weights[order[n].i] === 0) continue;
    parts[order[n].i] += 1;
    remaining -= 1;
  }
  return parts.map((p) => sign * p);
}

/* =====================================================================
   lib/categories.ts
   ===================================================================== */

const CATEGORIES = ["Dining","Groceries","Transport","Accommodation","Attractions",
  "Shopping","Nightlife","Utilities","Health","Other"];

const CATEGORY_EMOJI = {
  Dining: "🍽️", Groceries: "🛒", Transport: "🚕", Accommodation: "🏨",
  Attractions: "🎟️", Shopping: "🛍️", Nightlife: "🍸", Utilities: "💡",
  Health: "💊", Other: "🧾",
};

const VOCABULARY = [
  ["Nightlife", ["bar","pub","club","cocktail","beer","nightcap","brewery","wine bar","tapas bar"]],
  ["Groceries", ["grocer","groceries","supermarket","market","mercado","deli","bakery","butcher","corner shop"]],
  ["Dining", ["restaurant","dinner","lunch","breakfast","brunch","cafe","café","coffee",
    "tasca","taqueria","bistro","diner","takeaway","food","pizza","sushi","steak","salmon",
    "chicken","pasta","burger","salad","soup","sandwich","fries","tapas","dessert",
    "appetizer","entree","risotto","curry","noodle","burrata","toast"]],
  ["Transport", ["taxi","uber","lyft","cab","train","metro","bus","tram","flight","airline",
    "airport","fuel","petrol","gas","parking","toll","car hire","rental car","ferry","fare"]],
  ["Accommodation", ["hotel","hostel","airbnb","guesthouse","lodge","motel","apartment","stay","accommodation","resort"]],
  ["Attractions", ["museum","gallery","tour","ticket","entry","entrance","park","zoo","aquarium",
    "castle","cathedral","show","concert","cinema","theatre","theater","excursion","sightseeing"]],
  ["Health", ["pharmacy","chemist","doctor","clinic","hospital","medicine","dentist","insurance"]],
  ["Shopping", ["shop","store","clothes","clothing","souvenir","gift","electronics","book","mall"]],
  ["Utilities", ["wifi","internet","phone","sim","data","electricity","water bill","laundry","utilities"]],
];

// Stems match their plurals: `\bcocktail\b` misses "Cocktails".
const RULES = VOCABULARY.map(function (entry) {
  const words = entry[1].map((w) => w.replace(/ /g, " ?")).join("|");
  return [entry[0], new RegExp("\\b(?:" + words + ")(?:e?s)?\\b", "i")];
});

function classifyLocally(text) {
  for (const rule of RULES) if (rule[1].test(text)) return rule[0];
  return "Other";
}

/* =====================================================================
   lib/splits.ts — Claude's item→person mapping to exact amounts
   ===================================================================== */

const WHOLE_BILL = "WHOLE_BILL";

const normalizeName = (name) =>
  name.trim().toLowerCase().normalize("NFKD")
    .replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");

const isUsableWeighting = (w) =>
  w.every((x) => Number.isFinite(x) && x >= 0) && w.reduce((a, b) => a + b, 0) > 0;

const money = (cents) => "$" + (Math.abs(cents) / 100).toFixed(2);

function computeFinalSplits(parsed, members) {
  const warnings = [];
  const warn = (code, message, lineItemTempId) =>
    warnings.push({ code: code, message: message, lineItemTempId: lineItemTempId });

  if (members.length === 0) return { splits: [], warnings: warnings, totalCents: 0 };

  for (const item of parsed.unresolved_items) {
    warn("model_flagged", item.reason, item.line_item_temp_id);
  }

  const byName = new Map();
  for (const m of members) {
    const key = normalizeName(m.displayName);
    byName.set(key, (byName.get(key) || []).concat([m]));
  }

  const subtotalByMember = new Map(members.map((m) => [m.id, 0]));
  const credit = (id, amount) =>
    subtotalByMember.set(id, (subtotalByMember.get(id) || 0) + amount);

  const resolve = (names, tempId) =>
    names.map(function (name) {
      const matches = byName.get(normalizeName(name));
      if (!matches || matches.length === 0) {
        warn("unknown_member_name", '"' + name + '" doesn\'t match anyone in this group.', tempId);
        return null;
      }
      if (matches.length > 1) {
        warn("ambiguous_member_name",
          '"' + name + '" matches ' + matches.length + " members — assign this one by hand.", tempId);
        return null;
      }
      return matches[0];
    });

  const assignmentFor = new Map();
  for (const a of parsed.assignments) {
    if (assignmentFor.has(a.line_item_temp_id)) {
      warn("duplicate_assignment",
        "Two assignments were returned for the same item; using the first.", a.line_item_temp_id);
      continue;
    }
    assignmentFor.set(a.line_item_temp_id, a);
  }

  let itemsTotal = 0;

  for (const item of parsed.line_items) {
    const lineTotal = toCents(item.line_total);
    itemsTotal += lineTotal;

    const assignment = assignmentFor.get(item.temp_id);
    let participants = [];
    let weights = [];

    if (assignment && assignment.member_names.length > 0) {
      const resolved = resolve(assignment.member_names, item.temp_id);
      const usesShares = assignment.split_type === "shares";
      const sharesAligned =
        usesShares && assignment.shares.length === assignment.member_names.length;

      if (usesShares && !sharesAligned) {
        warn("invalid_shares",
          'Share weights don\'t line up with the names on "' + item.description +
          '"; split evenly instead.', item.temp_id);
      }

      resolved.forEach(function (member, i) {
        if (!member) return;
        participants.push(member);
        weights.push(sharesAligned ? assignment.shares[i] : 1);
      });

      if (usesShares && sharesAligned && !isUsableWeighting(weights)) {
        warn("invalid_shares",
          'Share weights on "' + item.description + '" aren\'t usable; split evenly instead.',
          item.temp_id);
        weights = participants.map(() => 1);
      }
    }

    if (participants.length === 0) {
      warn("unassigned_item",
        '"' + item.description + '" wasn\'t assigned to anyone; split across everyone.',
        item.temp_id);
      participants = members;
      weights = members.map(() => 1);
    }

    const parts = apportion(lineTotal, weights, participants.map((m) => m.id));
    participants.forEach((m, i) => credit(m.id, parts[i]));
  }

  const subtotalCents = toCents(parsed.subtotal);
  const remainder = subtotalCents - itemsTotal;

  if (remainder > 0) {
    const wholeBill = assignmentFor.get(WHOLE_BILL);
    let participants = [];
    let weights = [];

    if (wholeBill && wholeBill.member_names.length > 0) {
      const resolved = resolve(wholeBill.member_names, WHOLE_BILL);
      const sharesAligned =
        wholeBill.split_type === "shares" &&
        wholeBill.shares.length === wholeBill.member_names.length;
      resolved.forEach(function (member, i) {
        if (!member) return;
        participants.push(member);
        weights.push(sharesAligned ? wholeBill.shares[i] : 1);
      });
      if (participants.length > 0 && !isUsableWeighting(weights)) {
        weights = participants.map(() => 1);
      }
    }

    if (participants.length === 0) {
      if (parsed.line_items.length > 0) {
        warn("subtotal_mismatch",
          "The line items are " + money(remainder) +
          " short of the subtotal; the difference was split across everyone.");
      }
      participants = members;
      weights = members.map(() => 1);
    }

    const parts = apportion(remainder, weights, participants.map((m) => m.id));
    participants.forEach((m, i) => credit(m.id, parts[i]));
  } else if (remainder < 0) {
    warn("subtotal_mismatch",
      "The line items add up to " + money(-remainder) + " more than the stated subtotal.");
  }

  const baseTotal = Array.from(subtotalByMember.values()).reduce((a, b) => a + b, 0);
  const extras = toCents(parsed.tax) + toCents(parsed.tip) + toCents(parsed.other_charges);
  const ids = members.map((m) => m.id);

  let extraParts;
  if (extras === 0) extraParts = members.map(() => 0);
  else if (baseTotal === 0) extraParts = apportion(extras, members.map(() => 1), ids);
  else extraParts = apportion(extras, members.map((m) => subtotalByMember.get(m.id) || 0), ids);

  const splits = members.map((m, i) => ({
    memberId: m.id,
    memberName: m.displayName,
    amountOwed: (subtotalByMember.get(m.id) || 0) + extraParts[i],
  }));

  const totalCents = splits.reduce((s, x) => s + x.amountOwed, 0);
  const grandTotal = toCents(parsed.grand_total);
  if (totalCents !== grandTotal) {
    warn("total_mismatch",
      "Receipt total reads " + money(grandTotal) + ", but the items, tax and tip add up to " +
      money(totalCents) + ". Check the receipt before saving.");
  }

  return { splits: splits, warnings: warnings, totalCents: totalCents };
}

/* =====================================================================
   lib/balances.ts
   ===================================================================== */

function computeBalances(members, expenses, settlements) {
  const net = new Map(members.map((m) => [m.id, 0]));
  const add = (id, amount) => {
    if (!net.has(id)) return;
    net.set(id, (net.get(id) || 0) + amount);
  };
  for (const e of expenses) {
    for (const p of e.payers) add(p.memberId, p.amountPaid);
    for (const s of e.splits) add(s.memberId, -s.amountOwed);
  }
  for (const s of settlements) {
    add(s.fromMember, s.amount);
    add(s.toMember, -s.amount);
  }
  return members.map((m) => ({
    memberId: m.id, displayName: m.displayName, net: net.get(m.id) || 0,
  }));
}

/** Greedy: match the largest creditor with the largest debtor. */
function simplifyDebts(balances) {
  const byMagnitude = (a, b) =>
    Math.abs(b.net) - Math.abs(a.net) ||
    (a.memberId < b.memberId ? -1 : a.memberId > b.memberId ? 1 : 0);

  const creditors = balances.filter((b) => b.net > 0).sort(byMagnitude);
  const debtors = balances.filter((b) => b.net < 0).sort(byMagnitude);

  const owedTotal = creditors.reduce((s, c) => s + c.net, 0);
  const debtTotal = debtors.reduce((s, d) => s - d.net, 0);
  if (owedTotal !== debtTotal) throw new Error("Balances don't sum to zero");

  const transfers = [];
  const remaining = new Map(balances.map((b) => [b.memberId, b.net]));
  let ci = 0, di = 0, iterations = 0;
  const maxIterations = 2 * (creditors.length + debtors.length) + 1;

  while (ci < creditors.length && di < debtors.length) {
    if (++iterations > maxIterations) throw new Error("failed to converge");
    const creditor = creditors[ci], debtor = debtors[di];
    const credit = remaining.get(creditor.memberId) || 0;
    const debt = -(remaining.get(debtor.memberId) || 0);
    if (credit === 0) { ci++; continue; }
    if (debt === 0) { di++; continue; }
    const amount = Math.min(credit, debt);
    transfers.push({ fromMemberId: debtor.memberId, toMemberId: creditor.memberId, amount: amount });
    remaining.set(creditor.memberId, credit - amount);
    remaining.set(debtor.memberId, -(debt - amount));
  }
  return transfers;
}

/* =====================================================================
   lib/insights.ts
   ===================================================================== */

function buildInsights(expenses, memberId) {
  const byCategory = new Map();
  let groupTotal = 0, yourTotal = 0, uncategorized = 0, largest = null;

  for (const expense of expenses) {
    const category = expense.category || "Other";
    if (expense.category === null) uncategorized += 1;

    const yourShare = expense.splits
      .filter((s) => s.memberId === memberId)
      .reduce((sum, s) => sum + s.amountOwed, 0);

    groupTotal += expense.totalAmount;
    yourTotal += yourShare;

    const slice = byCategory.get(category) ||
      { category: category, groupCents: 0, yourCents: 0, count: 0 };
    slice.groupCents += expense.totalAmount;
    slice.yourCents += yourShare;
    slice.count += 1;
    byCategory.set(category, slice);

    if (!largest || expense.totalAmount > largest.cents) {
      largest = { description: expense.description, cents: expense.totalAmount, category: category };
    }
  }

  const order = new Map(CATEGORIES.map((c, i) => [c, i]));
  const slices = Array.from(byCategory.values())
    .filter((s) => s.groupCents !== 0)
    .sort((a, b) => b.groupCents - a.groupCents ||
      (order.get(a.category) || 0) - (order.get(b.category) || 0));

  return {
    groupTotal: groupTotal, yourTotal: yourTotal, expenseCount: expenses.length,
    byCategory: slices, largest: largest, uncategorized: uncategorized,
  };
}

          <div class="tile"><div class="tile-label">Expenses</div><div class="tile-value">${insights.expenseCount}</div></div>
          <div class="tile"><div class="tile-label">Top</div><div class="tile-value">${top ? CATEGORY_EMOJI[top.category] + " " + top.category : "—"}</div></div>
          <div class="tile"><div class="tile-label">Biggest</div><div class="tile-value num">${insights.largest ? formatCents(insights.largest.cents) : "—"}</div></div>
        </div>
        <div style="margin-top:24px;display:flex;flex-direction:column;gap:14px">
          ${rows.map(function (r) {
            const cents = state.measure === "group" ? r.groupCents : r.yourCents;
            const pct = total ? Math.round((cents / total) * 100) : 0;
            return `<div>
              <div class="row" style="font-size:15px">
                <span><span aria-hidden="true">${CATEGORY_EMOJI[r.category]}</span> ${r.category}</span>
                <span style="font-weight:600" class="num">${formatCents(cents)}</span></div>
              <div style="margin-top:6px;display:flex;align-items:center;gap:8px">
                <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, (cents / peak) * 100)}%"></div></div>
                <span style="width:36px;text-align:right;font-size:12px" class="muted num">${pct}%</span></div>
              <div style="margin-top:4px;font-size:12px" class="muted">${r.count} expense${r.count === 1 ? "" : "s"}${
                state.measure === "group" && r.yourCents > 0 ? " · your share " + formatCents(r.yourCents) : ""}</div>
            </div>`;
          }).join("")}
        </div>
        <p style="margin:16px 0 0;font-size:12px" class="muted">Categorized by keyword — the live app sends descriptions and receipt line items to Claude.</p>
      </div>

      <div class="card card-data">
        <h2 class="card-title">Expenses</h2>
        <div class="divide" style="margin-top:12px">
          ${expenses.map((e) => `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0">
            <div style="display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(245,217,176,.4);font-size:16px;flex-shrink:0">${e.category ? CATEGORY_EMOJI[e.category] : "🧾"}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600">${esc(e.description)}</div>
              <div style="font-size:12px" class="muted">${e.category || "Uncategorized"} · ${esc(e.payers.map((p) => nameOf(g, p.memberId)).join(" & "))} paid${e.lineItems.length ? " · " + e.lineItems.length + " items" : ""}</div>
            </div>
            <div style="font-weight:700;flex-shrink:0" class="num">${formatCents(e.totalAmount)}</div>
          </div>`).join("")}
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Members</h2>
        <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">
          ${g.members.map((m) => `<span class="chip ${m.isGhost ? "chip-ghost" : "chip-real"}">${esc(m.displayName)}${m.isGhost ? ' <span style="font-size:10px;opacity:.6">ghost</span>' : ""}</span>`).join("")}
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Activity</h2>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
          ${state.db.activity.slice().sort((a, b) => b.createdAt - a.createdAt).map((a) => `<div style="display:flex;gap:10px;font-size:14px">
            <span style="margin-top:6px;width:6px;height:6px;border-radius:999px;background:var(--ginger);flex-shrink:0"></span>
            <span style="color:rgba(42,33,28,.65)">${esc(a.summary)}</span></div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

function viewAdd() {
  const g = group();
  return `<div class="app">${appHead()}
    <button class="back" data-act="open" data-id="${g.id}">← ${esc(g.name)}</button>
    <div style="margin-top:12px">
      <h1 class="card-title" style="font-size:26px">Add an expense</h1>
      <p class="lede" style="margin-top:6px;font-size:14px">Leave the category on Auto and Tabby will work it out.</p>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="stack">
        <div><label class="label" for="f-desc">What was it?</label>
          <input class="field" id="f-desc" placeholder="Groceries, cab, tickets…"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label class="label" for="f-amt">Amount</label>
            <input class="field" id="f-amt" inputmode="decimal" placeholder="0.00"></div>
          <div><label class="label" for="f-cat">Category</label>
            <select class="field" id="f-cat">
              <option value="">✨ Auto</option>
              ${CATEGORIES.map((c) => `<option value="${c}">${CATEGORY_EMOJI[c]} ${c}</option>`).join("")}
            </select></div>
        </div>
        <div><label class="label" for="f-payer">Who paid?</label>
          <select class="field" id="f-payer">
            ${g.members.map((m) => `<option value="${m.id}">${esc(m.displayName)}</option>`).join("")}
          </select></div>
        <div><span class="label">Split equally between</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px" id="f-people">
            ${g.members.map((m) => `<button class="person" data-act="who" data-id="${m.id}" aria-pressed="true">${esc(m.displayName)}</button>`).join("")}
          </div></div>
        ${state.error ? `<p style="margin:0;font-size:14px" class="ginger">${esc(state.error)}</p>` : ""}
        <button class="btn btn-primary" data-act="save-manual">Save expense</button>
      </div>
    </div>
  </div>`;
}

function viewReceipt() {
  const g = group();
  const r = state.receipt;

  if (!r || r.stage === "capture") {
    return `<div class="app">${appHead()}
      <button class="back" data-act="open" data-id="${g.id}">← ${esc(g.name)}</button>
      <div style="margin-top:12px">
        <h1 class="card-title" style="font-size:26px">Scan a receipt</h1>
        <p class="lede" style="margin-top:6px;font-size:14px">Photograph the bill, say who had what, and review before it saves.</p>
      </div>
      <div class="stack" style="margin-top:20px">
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:36px">🧾</div>
          <div style="margin-top:12px;font-weight:600">Photograph the receipt</div>
          <div style="margin-top:4px;font-size:14px" class="muted">Uses a sample bill in this prototype</div>
        </div>
        <div class="card">
          <label class="label" for="f-instr">Who had what?</label>
          <textarea class="field" id="f-instr" rows="3" style="resize:none"
            placeholder="Sarah had the salmon and the wine, John and I split the app, split the rest evenly"></textarea>
          <p style="margin:12px 0 0;font-size:12px" class="muted">The live app also takes a voice memo here.</p>
        </div>
        <button class="btn btn-primary" data-act="parse" ${state.busy ? "disabled" : ""}>
          ${state.busy ? "Reading the receipt…" : "Split it"}</button>
      </div>
    </div>`;
  }

  const result = computeFinalSplits(r.parsed, g.members);
  const itemRows = r.parsed.line_items.map((i) => ({
    tempId: i.temp_id, label: i.description, cents: toCents(i.line_total),
  }));
  const extras = toCents(r.parsed.tax) + toCents(r.parsed.tip) + toCents(r.parsed.other_charges);

  return `<div class="app">${appHead()}
    <button class="back" data-act="open" data-id="${g.id}">← ${esc(g.name)}</button>
    <div style="margin-top:12px">
      <h1 class="card-title" style="font-size:26px">Review the split</h1>
    </div>
    <div class="stack" style="margin-top:20px">
      <div class="notice notice-sample"><strong>Sample receipt.</strong> The live app reads a real photo here — the review and maths below are the real thing either way.</div>

      ${result.warnings.length ? `<div class="notice notice-warn">
        <h3 style="margin:0;font-size:14px;font-weight:800" class="ginger">Worth a look before you save</h3>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
          ${result.warnings.map((w) => `<div style="font-size:14px;color:rgba(42,33,28,.7)">• ${esc(w.message)}</div>`).join("")}
        </div></div>` : ""}

      <div class="card">
        <div class="stack">
          <div><label class="label" for="f-rdesc">Description</label>
            <input class="field" id="f-rdesc" value="${esc(r.description)}" data-act="rdesc"></div>
          <div><label class="label" for="f-rpayer">Who paid?</label>
            <select class="field" id="f-rpayer" data-act="rpayer">
              ${g.members.map((m) => `<option value="${m.id}"${m.id === r.payerId ? " selected" : ""}>${esc(m.displayName)}</option>`).join("")}
            </select></div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Items</h2>
        <p style="margin:6px 0 0;font-size:12px" class="muted">Tap a name to add or remove them from an item.</p>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:16px">
          ${itemRows.map(function (row) {
            const a = r.parsed.assignments.find((x) => x.line_item_temp_id === row.tempId);
            const flagged = result.warnings.some((w) => w.lineItemTempId === row.tempId);
            return `<div style="border-radius:16px;padding:12px;${flagged
              ? "background:rgba(217,115,13,.05);box-shadow:0 0 0 1px rgba(217,115,13,.25)"
              : "background:var(--canvas)"}">
              <div class="row"><span style="font-weight:600">${esc(row.label)}</span>
                <span style="font-weight:600" class="num">${formatCents(row.cents)}</span></div>
              <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
                ${g.members.map(function (m) {
                  const on = a && a.member_names.some((n) =>
                    n.trim().toLowerCase() === m.displayName.trim().toLowerCase());
                  return `<button class="person" data-act="toggle" data-item="${row.tempId}" data-name="${esc(m.displayName)}" aria-pressed="${!!on}">${esc(m.displayName)}</button>`;
                }).join("")}
              </div></div>`;
          }).join("")}
        </div>
        ${extras !== 0 ? `<p style="margin:16px 0 0;padding-top:12px;border-top:1px solid rgba(42,33,28,.08);font-size:14px" class="muted">Tax, tip and fees (${formatCents(extras)}) are spread in proportion to what each person ate.</p>` : ""}
      </div>

      <div class="card card-data">
        <h2 class="card-title">Each person owes</h2>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
          ${result.splits.map((s) => `<div class="row"><span style="font-size:15px">${esc(s.memberName)}</span>
            <span style="font-size:15px;font-weight:600" class="num">${formatCents(s.amountOwed)}</span></div>`).join("")}
        </div>
        <div class="row" style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(42,33,28,.08)">
          <span style="font-weight:800">Total</span>
          <span style="font-weight:800" class="teal num">${formatCents(result.totalCents)}</span></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px">
        <button class="btn btn-secondary" data-act="recapture">Back</button>
        <button class="btn btn-primary" data-act="save-receipt">Save expense</button>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   Render + events
   ===================================================================== */

const viewEl = document.getElementById("view");
const screenEl = document.getElementById("screen");

function render(keepScroll) {
  const y = screenEl.scrollTop;
  const views = {
    welcome: viewWelcome, home: viewHome, group: viewGroup,
    add: viewAdd, receipt: viewReceipt,
  };
  viewEl.innerHTML = views[state.screen]();
  screenEl.scrollTop = keepScroll ? y : 0;
}

function go(screen) {
  state.screen = screen;
  state.error = null;
  render(false);
}

document.addEventListener("click", function (event) {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const g = group();

  if (act === "next") {
    if (state.step < STEPS.length - 1) { state.step++; render(false); }
    else { categorizePending(g); go("home"); }
  } else if (act === "skip") {
    categorizePending(g); go("home");
  } else if (act === "tour") {
    state.step = 0; go("welcome");
  } else if (act === "home") {
    go("home");
  } else if (act === "open") {
    state.groupId = el.dataset.id;
    categorizePending(group());
    go("group");
  } else if (act === "add") {
    go("add");
  } else if (act === "receipt") {
    state.receipt = null; go("receipt");
  } else if (act === "measure") {
    state.measure = el.dataset.v; render(true);
  } else if (act === "who") {
    el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") === "true" ? "false" : "true");
  } else if (act === "recapture") {
    state.receipt = null; render(false);

  } else if (act === "parse") {
    state.busy = true; render(true);
    setTimeout(function () {
      state.busy = false;
      state.receipt = {
        stage: "review", parsed: demoReceipt(g.members),
        payerId: g.members[0].id, description: "Receipt",
      };
      render(false);
    }, 900);

  } else if (act === "toggle") {
    const r = state.receipt;
    const tempId = el.dataset.item, name = el.dataset.name;
    const idx = r.parsed.assignments.findIndex((a) => a.line_item_temp_id === tempId);
    if (idx === -1) {
      r.parsed.assignments.push({
        line_item_temp_id: tempId, member_names: [name], split_type: "equal", shares: [],
      });
    } else {
      const existing = r.parsed.assignments[idx];
      const has = existing.member_names.indexOf(name) !== -1;
      const names = has
        ? existing.member_names.filter((n) => n !== name)
        : existing.member_names.concat([name]);
      // Dropping to nobody falls back to everyone with a warning — keep the
      // last person instead of surprising the host.
      if (names.length === 0) return;
      r.parsed.assignments[idx] = {
        line_item_temp_id: tempId, member_names: names, split_type: "equal", shares: [],
      };
    }
    render(true);

  } else if (act === "save-manual") {
    const desc = document.getElementById("f-desc").value.trim();
    const amount = document.getElementById("f-amt").value.trim();
    const chosen = Array.from(document.querySelectorAll('#f-people [aria-pressed="true"]'))
      .map((b) => b.dataset.id);
    const payerId = document.getElementById("f-payer").value;
    const category = document.getElementById("f-cat").value;

    if (!desc) { state.error = "Give the expense a description."; return render(true); }
    if (!chosen.length) { state.error = "Pick at least one person to split between."; return render(true); }
    let cents;
    try { cents = toCents(amount); }
    catch (e) { state.error = "That amount doesn't look like a number."; return render(true); }
    if (cents <= 0) { state.error = "The amount has to be more than zero."; return render(true); }

    const expense = equalExpense({
      description: desc, category: category || null,
      categorySource: category ? "manual" : null,
      payers: [[payerId, cents]], participantIds: chosen, totalCents: cents,
    });
    expense.groupId = g.id;
    state.db.expenses.push(expense);
    state.db.activity.push({
      id: nextId(), groupId: g.id, createdAt: Date.now(),
      summary: nameOf(g, payerId) + " added " + desc,
    });
    categorizePending(g);
    go("group");

  } else if (act === "save-receipt") {
    const r = state.receipt;
    const result = computeFinalSplits(r.parsed, g.members);
    const desc = document.getElementById("f-rdesc").value.trim() || "Receipt";
    const payerId = document.getElementById("f-rpayer").value;

    state.db.expenses.push({
      id: nextId(), groupId: g.id, description: desc,
      category: null, categorySource: null,
      totalAmount: result.totalCents, currency: "USD",
      expenseDate: new Date().toISOString().slice(0, 10),
      sourceType: "receipt_ai",
      lineItems: r.parsed.line_items.map((i) => ({
        id: nextId(), description: i.description, quantity: i.quantity,
        unitPrice: toCents(i.unit_price), lineTotal: toCents(i.line_total),
      })),
      payers: [{ memberId: payerId, amountPaid: result.totalCents }],
      splits: result.splits.map((s) => ({
        memberId: s.memberId, lineItemId: null, splitType: "exact",
        shareValue: null, amountOwed: s.amountOwed,
      })),
      createdAt: Date.now(),
    });
    state.db.activity.push({
      id: nextId(), groupId: g.id, createdAt: Date.now(),
      summary: nameOf(g, payerId) + " added " + desc + " from a receipt",
    });
    state.receipt = null;
    categorizePending(g);
    go("group");
  }
});

// Keep typed values across the re-renders that editing triggers.
document.addEventListener("input", function (event) {
  if (!state.receipt) return;
  if (event.target.dataset.act === "rdesc") state.receipt.description = event.target.value;
});
document.addEventListener("change", function (event) {
  if (!state.receipt) return;
  if (event.target.dataset.act === "rpayer") state.receipt.payerId = event.target.value;
});

document.getElementById("restart").addEventListener("click", function () {
  uid = 0;
  Object.assign(state, {
    screen: "welcome", step: 0, groupId: "grp-lisbon", measure: "group",
    db: seed(), receipt: null, busy: false, error: null,
  });
  render(false);
});

render(false);
</script>
